<svg width="1024" height="1024" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cobalt Blue Squircle -->
  <rect width="512" height="512" rx="116" fill="#0074D9" />
  
  <!-- Screen Frame (White) -->
  <path d="M 268 140 H 122 A 36 36 0 0 0 86 176 V 348 A 36 36 0 0 0 122 384 H 344 A 36 36 0 0 0 380 348 V 232" 
        stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Wavy Stroke (White) -->
  <path d="M 116 348 C 146 348, 158 292, 184 292 C 210 292, 222 348, 254 348 C 288 348, 308 330, 338 330" 
        stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Stylus Pen (White with Cobalt Slit) -->
  <g transform="translate(322, 172) rotate(45)">
    <!-- Pen Silhouette: Rounded back at top (-Y), tapered tip at bottom (+Y) -->
    <path d="M -17 -96 
             L 17 -96 
             A 17 17 0 0 1 34 -79 
             L 34 50 
             L 0 122 
             L -34 50 
             L -34 -79 
             A 17 17 0 0 1 -17 -96 Z" 
          fill="#FFFFFF" />
    <!-- Slit revealing background -->
    <rect x="-4" y="-62" width="8" height="74" rx="4" fill="#0074D9" />
  </g>
</svg>